[project]
name = "uaalerts"
version = "0.1.0"
description = "Leakage-safe forecasting of air raid alerts in Ukraine (hourly, per oblast, 7-day horizon)"
readme = "README.md"
authors = [
    { name = "Roman Danyliuk", email = "romandanuliyk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "streamlit>=1.59.1",
    "typer>=0.27.3",
]

[project.scripts]
uaalerts = "uaalerts.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "DTZ", "RUF"]
# Ukrainian UI text legitimately mixes Cyrillic letters that look like Latin ones.
ignore = ["RUF001", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: tests that hit the internet (deselect with -m 'not network')"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
