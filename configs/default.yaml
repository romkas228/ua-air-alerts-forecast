# Forecasting setup (see docs/ARCHITECTURE.md and the decisions log in CLAUDE.md).
timezone: Europe/Kyiv
origin_hours: [0, 6, 12, 18]   # local Kyiv time
max_lead_hours: 168
lead_buckets:                  # inclusive lead ranges for reporting
  "1-6h": [1, 6]
  "7-24h": [7, 24]
  "1-3d": [25, 72]
  "4-7d": [73, 168]
# Weekly walk-forward: refit before each test week on rows whose labels are known by then
# (origin + max_lead <= week start). Tuning uses the same scheme on the weeks before test.
test_weeks: 4                  # length of the dev period
tune_weeks: 4
# The former test period is now the dev period (model selection). Data after dev_end did not
# exist while developing: the final, prospective evaluation uses only that.
dev_end: "2026-10-10T09:00:00+00:00"
exclude_if_rate_above: 0.95     # per target, measured on the 28 days before test start
exclude_window_days: 28
regime_break: "2026-09-06T00:00:00+03:00"   # CMU resolution No. 1092: yellow/red alert levels

sources:
  vadimkin_official_url: https://raw.githubusercontent.com/Vadimkin/ukrainian-air-raid-sirens-dataset/main/datasets/official_data_en.csv
  alerts_in_ua_mirror_url: https://raw.githubusercontent.com/JustJimer/ukraine-air-alert-stats/main/archive/alerts_in_ua.csv
  siren_api_url: https://siren.pp.ua/api/v3
